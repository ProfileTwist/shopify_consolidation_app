# Fixed project name so the mysql-data volume is reused regardless of folder path.
name: shopify-consolidator

# Shared Shopify env — values come from shopify-consolidator/.env (git-ignored).
# Reuses the single LiquorPilot Shopify app's OAuth credentials.
x-shopify: &shopify
  # Shared APP_KEY so tokens encrypted by one container decrypt in the others.
  APP_KEY: ${APP_KEY:-}
  SHOPIFY_DRIVER: http
  SHOPIFY_APP_CLIENT_ID: ${SHOPIFY_APP_CLIENT_ID:-}
  SHOPIFY_APP_CLIENT_SECRET: ${SHOPIFY_APP_CLIENT_SECRET:-}
  SHOPIFY_SCOPES: read_orders,read_all_orders,read_shopify_payments_payouts,read_products,write_products,write_draft_orders
  SHOPIFY_REDIRECT_URI: http://liquorpilot.local:8080/api/shopify/callback
  SHOPIFY_FRONTEND_URL: http://liquorpilot.local:3000

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sfc
      MYSQL_USER: sfc
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  # PHP-FPM: serves the app + runs migrations/seed on boot.
  api:
    build:
      context: ./api
    environment:
      <<: *shopify
      RUN_MIGRATIONS: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sfc
      DB_USERNAME: sfc
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx in front of PHP-FPM (the REST API).
  api-web:
    image: nginx:alpine
    volumes:
      - ./api/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  # Background queue worker (the data-pull jobs).
  queue:
    build:
      context: ./api
    command: php artisan queue:work --tries=3 --backoff=30
    environment:
      <<: *shopify
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sfc
      DB_USERNAME: sfc
      DB_PASSWORD: secret
    depends_on:
      api:
        condition: service_started
      mysql:
        condition: service_healthy

  # Scheduler (hourly reconciliation sync).
  scheduler:
    build:
      context: ./api
    command: php artisan schedule:work
    environment:
      <<: *shopify
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sfc
      DB_USERNAME: sfc
      DB_PASSWORD: secret
    depends_on:
      api:
        condition: service_started
      mysql:
        condition: service_healthy

  # React SPA (served by nginx, proxies /api to api-web).
  web:
    build:
      context: ./web
    ports:
      - "3000:80"
    depends_on:
      - api-web

volumes:
  mysql-data:
