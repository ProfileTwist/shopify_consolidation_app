# Production SPA nginx (ECS). No /api proxy — the ALB routes /api to the API
# service directly, so this container only serves the static SPA + client-side
# routing fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
