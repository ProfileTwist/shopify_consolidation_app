services:
  # Local AWS (SNS + SQS) so the whole chain runs without a real AWS account.
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sns,sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro

  app:
    build:
      context: .
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:inbound-webhooks
      # Local testing convenience: skip Shopify HMAC check. NEVER set true in prod.
      SHOPIFY_WEBHOOK_SKIP_VERIFY: "true"
    depends_on:
      - localstack

  web:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    ports:
      - "8090:80"
    depends_on:
      - app
